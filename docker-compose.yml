services:
  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - backend/.env
    ports:
      - 5432:5432
    volumes:
      - ./backend/postgresql:/docker-entrypoint-initdb.d:z
      - db-data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - backend/.env
    ports:
      - 15432:80
    depends_on:
      - postgres
  backend:
    build:
      context: backend
    container_name: backend
    env_file:
      - backend/.env
    ports:
      - 8080:8080
    depends_on:
      - postgres
    volumes:
      - ./backend/metadata.json:/app/metadata.json:ro
      - ./backend/relations.json:/app/relations.json:ro
  frontend:
    build:
      context: frontend
    container_name: frontend
    environment:
      PUBLIC_API_URL: http://172.18.0.3:8080
      PUBLIC_INTERNAL_API_URL: http://backend:8080
    ports:
      - 3000:3000
    depends_on:
      - backend
volumes:
  db-data:
