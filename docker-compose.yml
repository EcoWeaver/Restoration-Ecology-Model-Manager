services:
  postgres:
    image: postgres:18
    container_name: postgres
    env_file:
      - backend/.env
    ports:
      - 5432:5432
    volumes:
      - ./backend/postgresql:/docker-entrypoint-initdb.d:ro,z
      - db-data:/var/lib/postgresql
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - backend/.env
    ports:
      - 15432:80
    depends_on:
      - postgres
  backend:
    build:
      context: backend
    container_name: backend
    env_file:
      - backend/.env
    ports:
      - 8080:8080
    depends_on:
      - postgres
    volumes:
      - ./backend/model_metadata.json:/app/model_metadata.json:ro,z
      - ./backend/node_metadata.json:/app/node_metadata.json:ro,z
      - ./backend/relation_metadata.json:/app/relation_metadata.json:ro,z
      - ./backend/relations.json:/app/relations.json:ro,z
  frontend:
    build:
      context: frontend
    container_name: frontend
    environment:
      # change this to the public-facing url when deploying
      PUBLIC_API_URL: http://localhost:8080
      PUBLIC_INTERNAL_API_URL: http://backend:8080
    ports:
      - 3000:3000
    depends_on:
      - backend
volumes:
  db-data:
