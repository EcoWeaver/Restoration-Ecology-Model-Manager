services:
  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    ports:
      - 25432:5432
    volumes:
      - ./postgresql:/docker-entrypoint-initdb.d:z
      - db-data:/var/lib/postgresql/data:z
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - 15432:80
    depends_on:
      - postgres
volumes:
  db-data:
