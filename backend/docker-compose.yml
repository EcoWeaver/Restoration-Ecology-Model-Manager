services:
  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./postgreSQL:/docker-entrypoint-initdb.d
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - 15432:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=swep@swep.de
      - PGADMIN_DEFAULT_PASSWORD=swep
    depends_on:
      - postgres
