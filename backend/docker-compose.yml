services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./postgreSQL:/docker-entrypoint-initdb.d
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - 15432:80
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
volumes:
  pgadmin:
