version = "2"

[formatters.settings.gofmt]
simplify = true
rewrite-rules = [
    { pattern = "interface{}", replacement = "any" },
    { pattern = "a[b:len(a)]", replacement = "a[b:]" },
]

[linters]
enable = [
    "asasalint",
    "bodyclose",
    "contextcheck",
    "gosec",
    "noctx",
    "perfsprint",
    "tagliatelle",
    "usestdlibvars",
]

[linters.settings.errcheck]
exclude-functions = [
    "(io.Closer).Close",
    "(github.com/jackc/pgx/v5.Tx).Rollback",
]

[linters.settings.staticcheck]
checks = ["all", "-ST1000", "-ST1006"]
initialisms = [
    "ACL",
    "API",
    "ASCII",
    "CPU",
    "CSS",
    "DNS",
    "EOF",
    "GUID",
    "HTML",
    "HTTP",
    "HTTPS",
    "ID",
    "IP",
    "JSON",
    "QPS",
    "RAM",
    "RPC",
    "SLA",
    "SMTP",
    "SQL",
    "SSH",
    "TCP",
    "TLS",
    "TTL",
    "UDP",
    "UI",
    "GID",
    "UID",
    "UUID",
    "URI",
    "URL",
    "UTF8",
    "VM",
    "XML",
    "XMPP",
    "XSRF",
    "XSS",
    "SIP",
    "RTP",
    "AMQP",
    "DB",
    "TS",

    "DOI",
    "ORCID",
    "GND",
]
http-status-code-whitelist = []

[linters.settings.tagliatelle.case]
overrides = [{ pkg = "zenodo", rules = { json = "snake" } }]
