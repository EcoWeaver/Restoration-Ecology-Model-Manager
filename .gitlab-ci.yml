stages:
  - check

backend:
  stage: check
  image: golang:latest
  before_script:
    - apt-get update
    - apt-get install -y make
  script:
    - cd backend
    - make build
    - make check
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

frontend:
  stage: check
  image: node:latest
  script:
    - cd frontend
    - npm ci
    - npm run check
    - npm run build
    - npm run lint
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
